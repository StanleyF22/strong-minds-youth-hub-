<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strong Minds Youth Hub</title>

<style>

:root{
--ochre:#c96f1d;
--sand:#e8c07d;
--earth:#954c2e;
--reef:#00a6a6;
--forest:#46754b;
--night:#1a1a2e;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f6f7f9;
color:#222;
transition:0.4s;
}

.dark{
background:#111827;
color:white;
}

header{
background:linear-gradient(135deg,var(--earth),var(--reef));
color:white;
padding:60px 20px;
text-align:center;
}

header h1{
font-size:3rem;
}

.pattern{
height:80px;
background:
radial-gradient(circle,var(--sand) 10%, transparent 11%) 0 0/40px 40px,
radial-gradient(circle,var(--ochre) 10%, transparent 11%) 20px 20px/40px 40px,
var(--earth);
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.dark .card{
background:#1f2937;
}

button{
background:var(--reef);
color:white;
border:none;
padding:12px 18px;
margin:5px;
border-radius:8px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.map-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.region{
cursor:pointer;
background:var(--sand);
padding:20px;
border-radius:12px;
}
